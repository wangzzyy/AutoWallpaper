
name: Build AutoWallpaper

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      release_version:
        description: "正式发布版本号，例如 v1.0.1；留空则只构建测试包"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  create_tag:
    name: Create release tag
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate version and create tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RELEASE_VERSION"
            echo "Use a version such as v1.0.1"
            exit 1
          fi

          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag $RELEASE_VERSION already exists."
            echo "Choose a new version."
            exit 1
          fi

          gh api --method POST "repos/$REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_VERSION" \
            -f "sha=$TARGET_SHA"

          echo "Created tag $RELEASE_VERSION at $TARGET_SHA"

  build:
    name: Build ${{ matrix.label }}
    needs: create_tag
    if: always() && (needs.create_tag.result == 'success' || needs.create_tag.result == 'skipped')
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Self-contained
            self_contained: "true"
            package: AutoWallpaper-win-x64

          - label: Framework-dependent
            self_contained: "false"
            package: AutoWallpaper-win-x64-framework-Non-Net8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate project
        id: project
        shell: pwsh
        run: |
          $projects = @(
            Get-ChildItem $env:GITHUB_WORKSPACE `
              -Recurse -Filter AutoWallpaper.csproj |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj)[\\/]'
              }
          )

          if ($projects.Count -eq 0) {
            throw "AutoWallpaper.csproj not found."
          }

          $project = $projects[0].FullName
          "path=$project" >> $env:GITHUB_OUTPUT
          Write-Host "Project: $project"

      - name: Restore
        run: dotnet restore "${{ steps.project.outputs.path }}"

      - name: Publish Windows x64
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "publish"

          if (Test-Path $output) {
            Remove-Item $output -Recurse -Force
          }

          $publishArgs = @(
            "publish"
            "${{ steps.project.outputs.path }}"
            "--configuration", "Release"
            "--runtime", "win-x64"
            "--self-contained", "${{ matrix.self_contained }}"
            "--output", "$output"
            "-p:PublishSingleFile=true"
            "-p:IncludeNativeLibrariesForSelfExtract=true"
            "-p:DebugType=None"
            "-p:DebugSymbols=false"
          )

          & dotnet @publishArgs

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed."
          }

          if (-not (Test-Path "$output\AutoWallpaper.exe")) {
            Get-ChildItem $output -Force |
              Format-Table Name, Length

            throw "AutoWallpaper.exe not found."
          }

          Write-Host "Published files:"
          Get-ChildItem $output -Force |
            Format-Table Name, Length

      - name: Create ZIP package
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:RELEASE_VERSION) {
            $version = $env:RELEASE_VERSION
          }
          elseif ($env:REF_TYPE -eq "tag") {
            $version = $env:REF_NAME
          }
          else {
            $version = "dev-$env:RUN_NUMBER"
          }

          $output = Join-Path $env:RUNNER_TEMP "publish"
          $zipName = "${{ matrix.package }}-$version.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path "$output\*" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (-not (Test-Path $zipPath)) {
            throw "ZIP package was not created."
          }

          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

          Write-Host "Created: $zipName"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Download both build packages
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          pattern: AutoWallpaper-win-x64*
          merge-multiple: true

      - name: Verify packages
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem "release-packages" -Filter "*.zip"
          )

          if ($files.Count -ne 2) {
            Get-ChildItem "release-packages" -Force |
              Format-Table Name, Length

            throw "Expected exactly 2 ZIP packages, found $($files.Count)."
          }

          $files | Format-Table Name, Length

      - name: Publish both packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}
          name: AutoWallpaper ${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-packages/AutoWallpaper-win-x64-${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}.zip
            release-packages/AutoWallpaper-win-x64-framework-Non-Net8-${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}.zip
